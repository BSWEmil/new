<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ernährungstracker – Einträge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <h1>Ernährungstracker</h1>
        <nav class="nav-tabs" aria-label="Seiten">
          <a class="active" href="index.html">Einträge</a>
          <a href="plan.html">Ziel &amp; Diagramm</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <p class="subtitle">Erfasse, was du heute gegessen hast – inklusive Makronährstoffe.</p>

      <section class="card">
        <h2>Eintrag hinzufügen</h2>
        <form id="mealForm" class="meal-form">
          <label>Lebensmittel<input type="text" id="food" placeholder="z. B. Hähnchenbrust" required /></label>
          <label>Menge (g)<input type="number" id="amount" min="1" step="1" required /></label>
          <label>Kalorien (kcal)<input type="number" id="calories" min="0" step="0.1" required /></label>
          <label>Eiweiß / Protein (g)<input type="number" id="protein" min="0" step="0.1" required /></label>
          <label>Kohlenhydrate (g)<input type="number" id="carbs" min="0" step="0.1" required /></label>
          <label>Fett (g)<input type="number" id="fat" min="0" step="0.1" required /></label>
          <button type="submit">Eintrag speichern</button>
        </form>
      </section>

      <section class="card">
        <h2>Tagesübersicht</h2>
        <div class="totals" id="totals">
          <div><span>Kalorien</span><strong id="totalCalories">0 kcal</strong></div>
          <div><span>Eiweiß</span><strong id="totalProtein">0 g</strong></div>
          <div><span>Kohlenhydrate</span><strong id="totalCarbs">0 g</strong></div>
          <div><span>Fett</span><strong id="totalFat">0 g</strong></div>
        </div>
      </section>

      <section class="card">
        <h2>Deine Einträge heute</h2>
        <ul id="mealList" class="meal-list"></ul>
        <p id="emptyState" class="empty-state">Noch keine Einträge vorhanden.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
